name: Cloud SEO & Sitemap Autopilot

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update SEO Pages and Sitemap
        run: |
          python3 auto_seo_publisher.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add static/ docs/ && git commit -m "Automated daily SEO sitemap & content refresh" && git push)

      - name: Ping IndexNow Search Engines for all 11 URLs
        run: |
          for page in "" "lp-matching.html" "lp-crowdworks.html" "lp-report.html" "lp-mercari.html" "topic-apology-mail.html" "topic-pairs-line.html" "topic-lancers-seo.html" "topic-gakuchika-es.html" "topic-univ-report.html" "topic-mercari-fake.html"; do
            curl -s -o /dev/null -w "IndexNow ${page}: %{http_code}\n" "https://api.indexnow.org/indexnow?url=https://studyhelperproject.github.io/ai-minukikun/${page}&key=426d5b75c2bb457ca034a31745a2300b" || true
          done
