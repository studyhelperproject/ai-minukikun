name: Cloud SEO & Daily PDCA Autopilot

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-pdca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Autonomous Daily PDCA Evaluation & SEO Expansion
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: |
          pip install requests python-dotenv
          python3 daily_pdca_engine.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add -A && git commit -m "Automated daily PDCA evaluation, metrics audit & SEO content expansion" && git push)

      - name: Ping IndexNow Search Engines for all deployed URLs
        run: |
          python3 -c '
          import json, urllib.request
          import auto_seo_publisher as seo
          with open("pdca_metrics_history.json", "r", encoding="utf-8") as f:
              hist = json.load(f)
          import os
          pages = [fn for fn in os.listdir("docs") if fn.endswith(".html") and fn != "index.html"]
          pages = [""] + sorted(pages)
          for p in pages:
              url = f"https://api.indexnow.org/indexnow?url={seo.BASE_URL}/{p}&key=426d5b75c2bb457ca034a31745a2300b"
              try:
                  req = urllib.request.urlopen(url, timeout=10)
                  print(f"IndexNow {p or \"root\"}: {req.status}")
              except Exception as e:
                  print(f"IndexNow {p or \"root\"}: {e}")
          '
