name: Cloud SEO & Daily PDCA Autopilot

on:
  schedule:
    - cron: "20 0,6,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-pdca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Autonomous Daily PDCA Evaluation & SEO Expansion
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: |
          pip install requests python-dotenv
          python3 daily_pdca_engine.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add -A && git commit -m "Automated daily PDCA evaluation, metrics audit & SEO content expansion" && git push)

      - name: Ping IndexNow Search Engines for all deployed URLs
        run: |
          python3 -c 'import os, daily_pdca_engine as d; pages = [""] + sorted([fn for fn in os.listdir("docs") if fn.endswith(".html") and fn != "index.html"]); print(d.ping_indexnow_all(pages))'
