name: Cloud SEO & Sitemap Autopilot

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update SEO Pages and Sitemap
        run: |
          python3 auto_seo_publisher.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add static/ docs/ && git commit -m "Automated daily SEO sitemap & content refresh" && git push)

      - name: Ping IndexNow Search Engines for all 25 URLs
        run: |
          python3 -c '
          import urllib.request
          import auto_seo_publisher as seo
          pages = ["", "lp-matching.html", "lp-crowdworks.html", "lp-report.html", "lp-mercari.html"] + [t["slug"] for t in seo.SEO_TOPICS]
          for p in pages:
              url = f"https://api.indexnow.org/indexnow?url={seo.BASE_URL}/{p}&key=426d5b75c2bb457ca034a31745a2300b"
              try:
                  req = urllib.request.urlopen(url, timeout=10)
                  print(f"IndexNow {p or \"root\"}: {req.status}")
              except Exception as e:
                  print(f"IndexNow {p or \"root\"}: {e}")
          '
